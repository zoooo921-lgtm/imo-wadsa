name: collect-imo-updates

on:
  schedule:
    - cron: "0 */3 * * *"   # 3시간마다 (UTC 기준)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector
        run: python3 collector.py
      - name: Commit updated data
        run: |
          git config user.name "imo-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/items.json
          git diff --cached --quiet || git commit -m "chore: update collected items"
          git push
