<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d63">
  <title>IMO Watch</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --accent:#0b3d63; --high:#c0392b; --bg:#f5f7fa; --card:#fff; --text:#1d2430; --muted:#6b7585; }
    @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1d232c; --text:#e6eaf0; --muted:#8e99a8; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; z-index:5; background:var(--accent); color:#fff; padding:14px 16px 10px; padding-top:calc(14px + env(safe-area-inset-top)); }
    h1 { font-size:18px; margin:0 0 2px; }
    #updated { font-size:12px; opacity:.8; }
    .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    input, select, button { font:inherit; border-radius:8px; border:0; padding:8px 10px; }
    input { flex:1 1 140px; min-width:0; }
    .chips { display:flex; gap:6px; margin-top:8px; overflow-x:auto; }
    .chip { background:rgba(255,255,255,.18); color:#fff; border-radius:999px; padding:5px 12px; white-space:nowrap; cursor:pointer; border:0; }
    .chip.on { background:#fff; color:var(--accent); font-weight:600; }
    main { padding:12px; display:grid; gap:10px; max-width:720px; margin:0 auto; }
    .card { background:var(--card); border-radius:12px; padding:12px 14px; box-shadow:0 1px 2px rgba(0,0,0,.06); border-left:4px solid transparent; }
    .card.high { border-left-color:var(--high); }
    .meta { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:11px; font-weight:700; padding:2px 6px; border-radius:6px; background:#e4e9f0; color:#333; }
    .badge.high { background:var(--high); color:#fff; }
    .badge.new { background:#2e8b57; color:#fff; }
    .title { margin:6px 0 0; font-size:15px; line-height:1.4; }
    .title a { color:inherit; text-decoration:none; }
    .empty { text-align:center; color:var(--muted); padding:40px 0; }
    #notifyBtn { background:#fff; color:var(--accent); font-weight:600; }
    #notifyBtn[hidden] { display:none; }
  </style>
</head>
<body>
  <header>
    <h1>IMO Watch</h1>
    <div id="updated">불러오는 중…</div>
    <div class="controls">
      <input id="q" type="search" placeholder="키워드 검색 (예: MARPOL)">
      <button id="notifyBtn" hidden>고우선순위 알림 켜기</button>
    </div>
    <div class="chips" id="flagChips"></div>
    <div class="chips" id="prioChips">
      <button class="chip on" data-prio="ALL">전체</button>
      <button class="chip" data-prio="high">고우선순위</button>
    </div>
  </header>
  <main id="list"></main>
  <script src="app.js"></script>
</body>
</html>
